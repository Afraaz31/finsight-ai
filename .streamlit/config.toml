# FinSight AI - Streamlit settings (read automatically when you run streamlit from the project root)
[theme]
base = "light"
primaryColor = "#2563EB"              # FinSight blue: buttons, links, active items
backgroundColor = "#F6F8FC"           # soft grey-blue page
secondaryBackgroundColor = "#EEF2F8"  # inputs, expanders
textColor = "#0F172A"
font = "sans serif"

[server]
maxUploadSize = 10                    # MB - same limit as the API

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"               # hide the "Deploy" button
